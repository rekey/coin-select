[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coin-selector"
version = "0.1.0"
description = "多因子选币: 全市场 USDT 永续 -> top N, 输出 RemotePairList 格式 pairlist.json"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["coin_selector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
