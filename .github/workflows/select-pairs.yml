name: select-pairs

on:
  schedule:
    - cron: "2 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: select-pairs
  cancel-in-progress: false

jobs:
  select-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: bapi.beasi.top  # 币安 API 反代域名 (须转发 /api/ 与 /fapi/ 路径)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install .

      - name: 币安 API 连通性探测
        run: |
          curl -fsS --max-time 10 "https://$API_BASE/fapi/v1/ping" >/dev/null
          echo "币安合约 API 可达 ($API_BASE)"

      - name: 运行选币
        run: python -m coin_selector --api-base "$API_BASE" --out ./out --report ./out/selection_report.csv

      - name: 结果变化则提交并推送
        id: commit
        run: |
          if [ ! -f pairlist.json ] || ! diff -q out/pairlist.json pairlist.json >/dev/null 2>&1; then
            cp out/pairlist.json out/selection_report.csv .
            git add pairlist.json selection_report.csv
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: 自动选币更新 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "已推送新选币结果"
          else
            echo "选币结果无变化, 跳过 commit"
          fi

      - name: 触发服务器更新 (webhook)
        if: steps.commit.outputs.pushed == 'true'
        env:
          TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          URL=$(python - <<'EOF'
          import json
          try:
              print(json.load(open("webhook.config.json"))["url"].strip())
          except Exception:
              print("")
          EOF
          )
          if [ -z "$URL" ]; then
            echo "::warning::webhook.config.json url 为空, 跳过触发"
            exit 0
          fi
          if [ -z "$TOKEN" ]; then
            echo "::warning::WEBHOOK_TOKEN secret 未配置, 跳过触发"
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
              -X POST "$URL" -H "X-Webhook-Token: $TOKEN" || echo "000")
            echo "触发尝试 $i: HTTP $code"
            [ "$code" != "000" ] && [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && exit 0
            [ "$i" -lt 3 ] && sleep 10
          done
          echo "::error::webhook 触发失败 (最后状态 $code)"
          exit 1
